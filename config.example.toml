# Meme-Trade-Bot – Konfiguration
# Kopiere diese Datei nach config.toml und passe sie an.
# Werte in ${...} werden aus Umgebungsvariablen gelesen (z. B. /etc/memebot.env).

# "paper" = Spielgeld mit echten Kursen, "live" = echte Trades
mode = "paper"
paper_start_sol = 1.0
poll_seconds = 5               # Hauptzyklus: Watchlist, Käufe, Statistik
live_prices = true            # Echtzeit-Kurse offener Positionen über Helius (PumpSwap-Pools)
position_poll_seconds = 2     # offene Positionen (Stop-Loss etc.) – eigene schnelle Schleife
db_path = "data/memebot.db"

[api]
# Helius (oder anderer RPC). Free reicht für Paper, für Live Developer-Plan empfohlen.
rpc_url = "https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
jupiter_base = "https://api.jup.ag/swap/v1"
jupiter_api_key = "${JUPITER_API_KEY}"     # leer = keyless (sehr langsam)
jupiter_min_interval_s = 1.1                # Free-Plan: 1 Anfrage/Sekunde
dexscreener_base = "https://api.dexscreener.com"
geckoterminal_base = "https://api.geckoterminal.com/api/v2"
rugcheck_base = "https://api.rugcheck.xyz/v1"
pumpportal_ws = "wss://pumpportal.fun/api/data"

[scout]
use_pumpportal = true           # Graduations über PumpPortal (Drittanbieter)
use_helius_migrations = true    # Graduations direkt aus der Blockchain (braucht HELIUS_API_KEY, Free reicht)
use_dexscreener_lists = true    # neue Profile + Boosts von DexScreener
use_geckoterminal = true        # neue + trendende Solana-Pools (beste Quelle für graduierte Coins)
min_age_min = 15                # ganz frische Launches meiden (Sniper/Rugs)
max_age_min = 480              # 8 h: danach ist der Hype meist vorbei
recheck_seconds = 30            # Kandidat erneut prüfen, wenn er noch nicht reif war
max_watchlist = 400
batch_per_cycle = 150           # so viele Kandidaten pro Zyklus (15 s) neu prüfen – 1 DexScreener-Anfrage je 30 Coins
dead_after_min = 60             # älter als 60 min und ...
dead_liquidity_usd = 5000       # ... Liquidität darunter oder ...
dead_volume_h1_usd = 2000       # ... Volumen 1 h darunter -> endgültig aus der Watchlist

[filters]
min_liquidity_usd = 20000
max_liquidity_usd = 750000
max_fdv_usd = 8000000
min_volume_h1_usd = 25000
min_txns_m5 = 20

[security]
max_rugcheck_score = 2000        # RugCheck "score" (höher = riskanter)
require_mint_revoked = true
require_freeze_revoked = true
min_lp_locked_pct = 80           # Liquidität gelockt oder verbrannt
max_top10_holder_pct = 35        # ohne Pools
max_single_holder_pct = 12
reject_risk_levels = ["danger"]
max_sell_impact_pct = 8          # Verkaufstest über Jupiter

[strategy]
min_score = 65                   # 0–100
max_change_m5_pct = 35           # oberhalb: FOMO-Spitze, nicht kaufen
min_change_m5_pct = 1.5
min_buy_sell_ratio_m5 = 1.25
max_drop_h1_pct = 25             # Kurs in 1 h stärker gefallen -> kein Einstieg (Abverkauf läuft)
max_drop_h6_pct = 35             # Kurs in 6 h stärker gefallen -> kein Einstieg (Hype vorbei)

[phase]
# Phasen-Check vor jedem Kauf: Kursverlauf seit Launch (GeckoTerminal-Kerzen)
enabled = true
max_drawdown_from_high_pct = 40  # mehr als 40 % unter dem bisherigen Hoch -> nicht kaufen
max_hours_since_high = 3         # Hoch liegt länger zurück UND Kurs > 25 % darunter -> nicht kaufen

[risk]
position_pct = 0.03              # Anteil vom Kapital pro Trade
min_position_sol = 0.01
max_position_sol = 0.5
max_open_positions = 4
max_daily_loss_pct = 0.10        # danach keine neuen Käufe bis Mitternacht (UTC)
max_drawdown_pct = 0.30          # vom Höchststand -> automatischer Not-Aus
sol_reserve = 0.03               # für Gebühren stehen lassen
cooldown_hours = 12              # gleichen Coin nicht direkt wieder kaufen

[exit]
# Zusammenspiel (Gewinn bezogen auf den Einstieg inkl. Gebühren):
#   −20 %  Stop-Loss (alles)
#   +25 %  erreicht -> Break-even-Stop: fällt der Kurs zurück auf +3 %, wird alles verkauft
#   +30 %  Take-Profit 1: ⅓ verkaufen
#   +50 %  erreicht -> Trailing-Stop aktiv: Rest verkaufen, wenn 20 % unter dem Hoch (frühestens bei +20 %)
#   +80 %  Take-Profit 2: noch ⅓ verkaufen
#   2 h    Zeitlimit
# "ladder" = Leiter wie oben, "simple" = nur ein Take-Profit + Stop-Loss (+ Zeitlimit)
mode = "ladder"
simple_take_profit_pct = 30
stop_loss_pct = 20
breakeven_activate_pct = 25
breakeven_floor_pct = 3
# [Gewinn in %, Anteil der ursprünglichen Menge]
take_profit_levels = [[30, 0.33], [80, 0.33]]
trailing_activate_pct = 50
trailing_stop_pct = 20
max_hold_min = 120
liquidity_drop_factor = 0.6      # Liquidität < 60 % vom Einstieg -> raus

[execution]
slippage_bps = 1000              # 10 %; Meme-Coins schwanken stark
max_buy_impact_pct = 3
priority_fee_lamports = 200000   # max. Priority Fee pro Transaktion
paper_extra_slippage_pct = 1.0   # Paper-Modus: zusätzlicher Abschlag, damit er nicht zu optimistisch ist
confirm_timeout_s = 60

[web]
host = "0.0.0.0"
port = 8080
user = "${WEB_USER}"
password = "${WEB_PASSWORD}"
